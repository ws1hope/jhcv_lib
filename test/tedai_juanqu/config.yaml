server:
  service_name: tedai_juanqu
  host: 127.0.0.1
  port: 8100
  url_path: /tedai_panjuan_detect

output:
  result_dir: result/juanqu/location
  log_dir: result/juanqu/log

inference:
  device: cuda
  # 各相机三区域（输送线内/输送线外/集卷）多边形与起终点配置
  liuzhi_roi_file: models/tedai_juanqu/camera_liuzhi_roi.json
  # camera 5 下卷 2 号工位分类模型
  classify_model: models/tedai_juanqu/out2_classify.onnx
  # camera 5 工位分类模型开关（默认 false）：置 true 时需同时配置 classify_model，
  # 开启后 cam5 输送线外收录额外要求分类结果为 2
  enable_classify: false
  # 分阶段调试日志开关（默认 false）：置 true 时在 log_dir 下额外写
  # tedai_debug_YYYYMMDD.jsonl（每相机每请求一行），用于跨帧归因目标丢失。
  debug_log_enable: false

# 盘卷进入区域事件（HTTP 响应 events 字段）
events:
  enable: true            # 总开关
  draw_debug: true        # 在结果图上绘制进入状态与判定信息
  entry_radius_px: 120    # 到 qishi 的距离阈值
  entry_t_ratio: 0.25     # 沿 qishi->zhongzhi 轴的投影比例上限
  dedup_frames: 5         # 已上报位置缓存的请求数
  track_timeout_ms: 5000  # 相机超过该时长未参与请求则重建基线
  match_radius_px: 150    # 跨请求连续性匹配阈值
  max_missed: 2           # 连续未匹配多少次后淘汰轨迹

# 每相机一个专属检测模型（与旧服务 model_path_panjuan_count_2 按下标对应）
# 本地单模型冒烟测试：6 个相机统一用 det.onnx（正式部署时改回各自专属模型）
cameras:
  - camera_id: 0
    det_model: models/tedai_juanqu/det.onnx
  - camera_id: 1
    det_model: models/tedai_juanqu/det.onnx
  - camera_id: 2
    det_model: models/tedai_juanqu/det.onnx
  - camera_id: 3
    det_model: models/tedai_juanqu/det.onnx
  - camera_id: 4
    det_model: models/tedai_juanqu/det.onnx
  - camera_id: 5
    det_model: models/tedai_juanqu/det.onnx
