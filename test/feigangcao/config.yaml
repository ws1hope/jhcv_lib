server:
  host: "127.0.0.1"
  port: 7012
  url_path: "/feigangrec"
models:
  det_model: "models/jiuyang/baocao/det.onnx"
  cls_model: "models/jiuyang/baocao/ocr_cls.onnx"
  cls_label: ""
inference:
  device: "gpu"
# 有效检测范围（按工位区分）：station_id 匹配请求中的 station_id。
# 多边形顶点为图像坐标（N 点多边形，>=3 点才启用）；
# 取中心点落在多边形内的定位框作为候选，再从中选置信度最高的送入分类模型；
# 不配置本段或 station_id 无匹配则不做范围过滤（默认全局检测）。
# 示例：
valid_roi:
  stations:
    - station_id: "1"
      points:
        - [911, 510]
        - [2403, 515]
        - [1500, 2076]
        - [921, 2074]
output:
  log_dir: "D:\\FeigangcaoLog"
  det_crop_dir: ""   # 定位框裁剪图保存目录（为空则存到输入图目录 results/station_<id>/detect 下）
  cls_crop_dir: ""   # 分类图保存目录，按类别建子文件夹（为空则存到输入图目录 results/station_<id>/classify/<类别> 下）
  x_image_dir: ""    # 分类结果为 "x" 时原图保存目录（为空则存到输入图目录 results/station_<id>/x_original 下）
